# Per provare l'immagine in locale (vedi deploy/README.md); in produzione si usa deploy/docker-compose.yml.
services:
  portfolio:
    build: .
    image: portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTFOLIO_PORT:-8085}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
